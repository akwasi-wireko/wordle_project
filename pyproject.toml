[project]
name = "wordle-lab"
version = "0.1.0"
description = "Wordle game and solver"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "requests>=2.32.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"